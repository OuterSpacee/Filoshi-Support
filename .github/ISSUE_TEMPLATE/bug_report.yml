name: Bug report
description: The app crashes, freezes, looks wrong, or does something it shouldn't.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If a specific conversion fails, use the **Conversion failed** form instead.
        **Never post your license key, order number or private files here.** This repository is public.
  - type: input
    id: version
    attributes:
      label: Filoshi version
      description: Settings → About shows it.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "Windows 11 24H2, macOS 15.1, Ubuntu 24.04"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error text if there was one. Copy it, don't paraphrase it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Filoshi
        2. Drop a file on the window
        3. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (Windows, 2.0)
      description: Settings → About → Copy diagnostics, then paste it here. It has no file names, folders or license keys, but read it before you paste.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help and show nothing private.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I read the "before you file" checklist in SUPPORT.md.
          required: true
        - label: This report contains no license key, order number or private file.
          required: true
